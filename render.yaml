services:
  - type: redis
    name: atlantist-redis
    plan: free
    ipAllowList: []

  - type: web
    name: atlantist
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run migrate && npm run build:verify
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CANONICAL_ORIGIN
        value: https://atlantist.cloud
      - key: DATABASE_URL
        fromDatabase:
          name: atlantist-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: atlantist-redis
          type: redis
          property: connectionString
      - key: WALLT_API_TOKEN
        sync: false
      - key: WALLT_MASTER_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_YEARLY
        sync: false
      - key: POLSIA_EMAIL_PROXY_URL
        sync: false
      - key: SUPPORT_FORWARD_1
        value: atlantist@polsia.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      # ── Contributor system ──────────────────────────────────────────────────
      # GITHUB_CLIENT_ID: GitHub OAuth App client ID (create at github.com/settings/developers)
      - key: GITHUB_CLIENT_ID
        sync: false
      # GITHUB_CLIENT_SECRET: GitHub OAuth App client secret
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # GITHUB_WEBHOOK_SECRET: Secret for verifying X-Hub-Signature-256 on webhook payloads
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # ENCRYPTION_KEY: 32-byte (64-char hex) key for AES-256-GCM encryption of OAuth tokens
      #   Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # NOTE: ENCRYPTION_KEY already declared above — reuse the same value.
      # STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET already declared above — reuse those values.

databases:
  - name: atlantist-db
    plan: free
    databaseName: atlantist
    user: atlantist
