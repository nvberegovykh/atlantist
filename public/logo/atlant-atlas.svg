<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="Atlantist Atlas">
  <title>Atlas — Atlantist Brand Character</title>
  <desc>Architectural caryatid figure holding an arch and T-square, concentric rings radiate from torso</desc>

  <defs>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d5c4"/>
      <stop offset="100%" stop-color="#d4bfae"/>
    </linearGradient>
    <linearGradient id="dress" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d5fa6"/>
      <stop offset="100%" stop-color="#3479c4"/>
    </linearGradient>
    <linearGradient id="arch-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d5fa6"/>
      <stop offset="100%" stop-color="#7fb3de"/>
    </linearGradient>
    <linearGradient id="tsquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#1e2835"/>
    </linearGradient>
  </defs>

  <!-- ── Concentric ring halo behind figure ── -->
  <circle cx="150" cy="180" r="130" fill="none" stroke="#cfe3f5" stroke-width="1" opacity="0.35"/>
  <circle cx="150" cy="180" r="105" fill="none" stroke="#7fb3de" stroke-width="1.5" opacity="0.5"/>
  <circle cx="150" cy="180" r="80" fill="none" stroke="#3479c4" stroke-width="1.5" opacity="0.65"/>
  <circle cx="150" cy="180" r="55" fill="none" stroke="#1d5fa6" stroke-width="2" opacity="0.75"/>
  <circle cx="150" cy="180" r="28" fill="none" stroke="#1d5fa6" stroke-width="2.5" opacity="0.85"/>
  <circle cx="150" cy="180" r="10" fill="#1d5fa6"/>

  <!-- ── Legs / lower body — modern geometric dress silhouette ── -->
  <!-- Dress body -->
  <path d="M 115 250 L 105 380 L 195 380 L 185 250 Z" fill="url(#dress)"/>
  <!-- Dress detail — vertical structural lines -->
  <line x1="135" y1="250" x2="130" y2="380" stroke="#3479c4" stroke-width="1" opacity="0.5"/>
  <line x1="165" y1="250" x2="170" y2="380" stroke="#3479c4" stroke-width="1" opacity="0.5"/>
  <!-- Hem detail -->
  <line x1="105" y1="380" x2="195" y2="380" stroke="#0f1923" stroke-width="2"/>

  <!-- ── Torso / upper body ── -->
  <!-- Torso: clean geometric shape -->
  <path d="M 115 250 L 120 175 L 150 165 L 180 175 L 185 250 Z" fill="url(#dress)"/>
  <!-- Torso structural line -->
  <line x1="150" y1="165" x2="150" y2="250" stroke="#3479c4" stroke-width="1" opacity="0.4"/>

  <!-- ── Neck ── -->
  <rect x="141" y="148" width="18" height="20" rx="2" fill="url(#skin)"/>

  <!-- ── Head — geometric oval ── -->
  <ellipse cx="150" cy="128" rx="28" ry="32" fill="url(#skin)"/>
  <!-- Hair — modern bun, architectural -->
  <path d="M 122 120 Q 122 100 150 98 Q 178 100 178 120" fill="#3d3a35"/>
  <!-- Bun knot -->
  <circle cx="150" cy="95" r="12" fill="#3d3a35"/>
  <!-- Face — clean minimal lines -->
  <line x1="140" y1="125" x2="138" y2="128" stroke="#3d3a35" stroke-width="1.5" stroke-linecap="round"/> <!-- eye -->
  <line x1="162" y1="125" x2="160" y2="128" stroke="#3d3a35" stroke-width="1.5" stroke-linecap="round"/> <!-- eye -->
  <path d="M 145 138 Q 150 142 155 138" fill="none" stroke="#3d3a35" stroke-width="1.5" stroke-linecap="round"/> <!-- smile -->

  <!-- ── Arms ── -->
  <!-- Left arm — raised holding arch -->
  <path d="M 115 190 Q 90 185 70 170 Q 65 165 68 160" fill="none" stroke="url(#skin)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left hand -->
  <circle cx="68" cy="158" r="8" fill="url(#skin)"/>

  <!-- Right arm — holding T-square -->
  <path d="M 185 190 Q 210 175 220 155 Q 225 148 228 150" fill="none" stroke="url(#skin)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right hand -->
  <circle cx="229" cy="150" r="8" fill="url(#skin)"/>

  <!-- ── T-square — held in right hand ── -->
  <!-- T-square body: horizontal bar -->
  <rect x="200" y="135" width="80" height="8" rx="1" fill="url(#tsquare)"/>
  <!-- T-square head: vertical -->
  <rect x="200" y="118" width="8" height="35" rx="1" fill="url(#tsquare)"/>
  <!-- Measurement tick marks -->
  <line x1="215" y1="135" x2="215" y2="143" stroke="#7fb3de" stroke-width="1"/>
  <line x1="230" y1="135" x2="230" y2="143" stroke="#7fb3de" stroke-width="1"/>
  <line x1="245" y1="135" x2="245" y2="143" stroke="#7fb3de" stroke-width="1"/>
  <line x1="260" y1="135" x2="260" y2="143" stroke="#7fb3de" stroke-width="1"/>

  <!-- ── Arch — held in left hand, overhead ── -->
  <!-- Arch body: segmented voussoirs -->
  <!-- Keystone -->
  <path d="M 55 165 L 68 158 L 68 148 L 55 152 Z" fill="#1d5fa6"/>
  <!-- Left voussoirs -->
  <path d="M 55 165 L 40 172 L 38 183 L 55 178 Z" fill="#3479c4"/>
  <path d="M 40 172 L 30 185 L 28 198 L 38 183 Z" fill="#1d5fa6"/>
  <!-- Right voussoirs -->
  <path d="M 68 158 L 82 165 L 80 178 L 68 148 Z" fill="#3479c4"/>
  <path d="M 82 165 L 95 175 L 93 188 L 80 178 Z" fill="#1d5fa6"/>
  <!-- Keystone top -->
  <path d="M 55 152 L 68 148 L 67 140 L 54 143 Z" fill="#7fb3de"/>
  <!-- Arch key label (no text, just geometric) -->
  <circle cx="61" cy="147" r="2" fill="#cfe3f5"/>

  <!-- ── Ground / base — architectural plinth ── -->
  <rect x="90" y="380" width="120" height="8" rx="1" fill="#1d5fa6"/>
  <rect x="80" y="388" width="140" height="5" rx="1" fill="#3479c4" opacity="0.6"/>

  <!-- ── Grid lines — structural detail ── -->
  <line x1="150" y1="55" x2="150" y2="15" stroke="#7fb3de" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 3"/>
  <line x1="55" y1="180" x2="20" y2="180" stroke="#7fb3de" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 3"/>
  <line x1="245" y1="180" x2="280" y2="180" stroke="#7fb3de" stroke-width="0.5" opacity="0.3" stroke-dasharray="4 3"/>
</svg>