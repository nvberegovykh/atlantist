<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 400" role="img" aria-label="Atlantist Modulor">
  <title>Modulor — Atlantist Brand Character</title>
  <desc>Architectural proportion diagram — human figure with arms outstretched in a square, golden ratio circle, proportional division lines</desc>

  <defs>
    <linearGradient id="fig-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d5c4"/>
      <stop offset="100%" stop-color="#d4bfae"/>
    </linearGradient>
    <linearGradient id="fig-suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d5fa6"/>
      <stop offset="100%" stop-color="#3479c4"/>
    </linearGradient>
    <radialGradient id="golden-circle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cfe3f5" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#7fb3de" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3479c4" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#7fb3de"/>
    </marker>
  </defs>

  <!-- ── Outer square boundary (arms span width) ── -->
  <!-- The figure stands within a perfect square — arms at sides, arms up -->
  <!-- Square bounding box: 60,20 to 220,380 — let's verify proportion -->
  <!-- Square outline: arms at sides = 60px wide, height 360 = 1:6 ratio ... adjust -->
  <!-- Let's use a golden rectangle: arms up = head at top, feet at bottom -->
  <!-- Square framing: 60px from figure center left, 60px right = 120px wide -->
  <!-- Foot to crown = 340px -->

  <!-- Outer bounding square — 240x240 centered on figure -->
  <rect x="20" y="20" width="240" height="380" fill="none" stroke="#cfe3f5" stroke-width="1" stroke-dasharray="none" opacity="0.3"/>
  <!-- Inner golden circle -->
  <circle cx="140" cy="200" r="90" fill="url(#golden-circle)" stroke="#7fb3de" stroke-width="1.5" opacity="0.6"/>

  <!-- ── Human figure — standing, arms outstretched forming a T ── -->
  <!-- Legs: simple geometric trousers -->
  <path d="M 125 300 L 120 380 L 138 380 L 140 300 Z" fill="url(#fig-suit)"/>
  <path d="M 155 300 L 160 380 L 142 380 L 140 300 Z" fill="url(#fig-suit)"/>
  <!-- Shoe detail -->
  <rect x="118" y="380" width="22" height="6" rx="2" fill="#0f1923"/>
  <rect x="140" y="380" width="22" height="6" rx="2" fill="#0f1923"/>
  <!-- Center line -->
  <line x1="140" y1="300" x2="140" y2="380" stroke="#3479c4" stroke-width="1" opacity="0.4"/>

  <!-- Torso -->
  <rect x="125" y="205" width="30" height="95" rx="4" fill="url(#fig-suit)"/>
  <!-- Suit detail: lapels/structure -->
  <path d="M 140 205 L 133 225 L 140 240 L 147 225 Z" fill="#3479c4" opacity="0.3"/>

  <!-- Arms — outstretched in T-pose (architectural reference) -->
  <!-- Left arm: shoulder to hand -->
  <rect x="58" y="218" width="67" height="14" rx="7" fill="url(#fig-skin)"/>
  <!-- Right arm -->
  <rect x="155" y="218" width="67" height="14" rx="7" fill="url(#fig-skin)"/>

  <!-- Hands -->
  <ellipse cx="52" cy="225" rx="9" ry="7" fill="url(#fig-skin)"/>
  <ellipse cx="228" cy="225" rx="9" ry="7" fill="url(#fig-skin)"/>

  <!-- Neck -->
  <rect x="135" y="192" width="10" height="15" rx="2" fill="url(#fig-skin)"/>

  <!-- Head -->
  <ellipse cx="140" cy="178" rx="16" ry="18" fill="url(#fig-skin)"/>
  <!-- Face: minimal — just two dots and a line -->
  <circle cx="135" cy="177" r="2" fill="#3d3a35"/>
  <circle cx="145" cy="177" r="2" fill="#3d3a35"/>
  <line x1="135" y1="185" x2="145" y2="185" stroke="#3d3a35" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ── Proportional division lines ── -->
  <!-- Foot level (0) -->
  <line x1="30" y1="386" x2="250" y2="386" stroke="#1d5fa6" stroke-width="1.5" opacity="0.8"/>
  <!-- Knee level (~2) -->
  <line x1="32" y1="345" x2="248" y2="345" stroke="#7fb3de" stroke-width="1" opacity="0.5" stroke-dasharray="6 4"/>
  <!-- Navel/waist level (4) -->
  <line x1="30" y1="300" x2="250" y2="300" stroke="#1d5fa6" stroke-width="1.5" opacity="0.8"/>
  <!-- Shoulder level (6) -->
  <line x1="30" y1="220" x2="250" y2="220" stroke="#7fb3de" stroke-width="1" opacity="0.6" stroke-dasharray="6 4"/>
  <!-- Crown level (8) -->
  <line x1="30" y1="160" x2="250" y2="160" stroke="#1d5fa6" stroke-width="1.5" opacity="0.8"/>

  <!-- ── Scale ruler on left ── -->
  <line x1="28" y1="160" x2="28" y2="386" stroke="#7fb3de" stroke-width="2"/>
  <!-- Tick marks and labels (numeric — no text, just geometric marks) -->
  <!-- 0 tick -->
  <line x1="20" y1="386" x2="28" y2="386" stroke="#7fb3de" stroke-width="1.5"/>
  <!-- 2 tick -->
  <line x1="24" y1="345" x2="28" y2="345" stroke="#7fb3de" stroke-width="1"/>
  <!-- 4 tick -->
  <line x1="20" y1="300" x2="28" y2="300" stroke="#7fb3de" stroke-width="1.5"/>
  <!-- 6 tick -->
  <line x1="24" y1="220" x2="28" y2="220" stroke="#7fb3de" stroke-width="1"/>
  <!-- 8 tick -->
  <line x1="20" y1="160" x2="28" y2="160" stroke="#7fb3de" stroke-width="1.5"/>

  <!-- ── Golden ratio circle annotation ── -->
  <!-- Center dot -->
  <circle cx="140" cy="200" r="3" fill="#1d5fa6"/>
  <!-- Radius annotation line -->
  <line x1="140" y1="200" x2="230" y2="200" stroke="#7fb3de" stroke-width="1" stroke-dasharray="4 3" opacity="0.5" marker-end="url(#arrowhead)"/>
  <!-- φ symbol — just a clean circle outline -->
  <circle cx="252" cy="200" r="8" fill="none" stroke="#3479c4" stroke-width="1.5" opacity="0.7"/>

  <!-- ── Proportion ratio annotation (lines connecting heights) ── -->
  <!-- Arm span line -->
  <line x1="52" y1="210" x2="228" y2="210" stroke="#cfe3f5" stroke-width="0.75" opacity="0.4"/>
  <!-- Height span annotation -->
  <line x1="235" y1="160" x2="250" y2="160" stroke="#7fb3de" stroke-width="1"/>
  <line x1="235" y1="386" x2="250" y2="386" stroke="#7fb3de" stroke-width="1"/>
  <line x1="250" y1="160" x2="250" y2="386" stroke="#7fb3de" stroke-width="1"/>

  <!-- Corner label dots (section markers) -->
  <circle cx="20" cy="20" r="2.5" fill="#7fb3de"/>
  <circle cx="260" cy="20" r="2.5" fill="#7fb3de"/>
  <circle cx="20" cy="400" r="2.5" fill="#7fb3de"/>
  <circle cx="260" cy="400" r="2.5" fill="#7fb3de"/>
</svg>