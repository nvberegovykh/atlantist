<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Atlantist">
  <title>Atlantist</title>
  <desc>Architect's drawing compass forming the letter A with concentric Atlantis citadel rings and four-pointed compass star — approved mark</desc>

  <!-- Dark background -->
  <rect width="400" height="400" fill="#0a0e14"/>

  <!-- === CONCENTRIC RINGS — Atlantis citadel motif === -->
  <!-- Five rings radiating from compass center, graduated opacity -->
  <circle cx="200" cy="220" r="160" fill="none" stroke="#c8cdd6" stroke-width="1.2" opacity="0.22"/>
  <circle cx="200" cy="220" r="132" fill="none" stroke="#c8cdd6" stroke-width="1.3" opacity="0.28"/>
  <circle cx="200" cy="220" r="104" fill="none" stroke="#c8cdd6" stroke-width="1.5" opacity="0.35"/>
  <circle cx="200" cy="220" r="76" fill="none" stroke="#c8cdd6" stroke-width="1.7" opacity="0.44"/>
  <circle cx="200" cy="220" r="48" fill="none" stroke="#c8cdd6" stroke-width="1.9" opacity="0.55"/>

  <!-- === DRAWING COMPASS — forms the letter A === -->
  <!-- Left leg -->
  <line x1="200" y1="52" x2="112" y2="370" stroke="#e0e4ea" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="200" y1="52" x2="288" y2="370" stroke="#e0e4ea" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Crossbar — A's middle bar / compass brace -->
  <line x1="144" y1="280" x2="256" y2="280" stroke="#e0e4ea" stroke-width="2.8" stroke-linecap="round"/>

  <!-- === COMPASS HEAD — architect's divider hinge at apex === -->
  <!-- Open triangular head — two arms meeting at pivot -->
  <line x1="200" y1="28" x2="186" y2="66" stroke="#e0e4ea" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="200" y1="28" x2="214" y2="66" stroke="#e0e4ea" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Pivot circle at apex -->
  <circle cx="200" cy="28" r="4" fill="none" stroke="#e0e4ea" stroke-width="1.8"/>
  <circle cx="200" cy="28" r="1.5" fill="#e0e4ea"/>

  <!-- === FOUR-POINTED COMPASS STAR at center === -->
  <!-- North point -->
  <path d="M 200 194 L 205 220 L 200 246 L 195 220 Z" fill="#e0e4ea" opacity="0.9"/>
  <!-- East-West points -->
  <path d="M 174 220 L 200 215 L 226 220 L 200 225 Z" fill="#e0e4ea" opacity="0.9"/>
  <!-- Center accent dot -->
  <circle cx="200" cy="220" r="3" fill="#e0e4ea"/>
</svg>
