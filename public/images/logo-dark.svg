<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Atlantist">
  <title>Atlantist</title>
  <desc>Architect's drawing compass forming the letter A with concentric Atlantis citadel rings and four-pointed compass star — dark variant for light backgrounds</desc>

  <!-- Light background -->
  <rect width="400" height="400" fill="#f4f5f7"/>

  <!-- === CONCENTRIC RINGS === -->
  <circle cx="200" cy="220" r="160" fill="none" stroke="#1e2738" stroke-width="1.2" opacity="0.18"/>
  <circle cx="200" cy="220" r="132" fill="none" stroke="#1e2738" stroke-width="1.3" opacity="0.24"/>
  <circle cx="200" cy="220" r="104" fill="none" stroke="#1e2738" stroke-width="1.5" opacity="0.32"/>
  <circle cx="200" cy="220" r="76" fill="none" stroke="#1e2738" stroke-width="1.7" opacity="0.40"/>
  <circle cx="200" cy="220" r="48" fill="none" stroke="#1e2738" stroke-width="1.9" opacity="0.50"/>

  <!-- === DRAWING COMPASS === -->
  <line x1="200" y1="52" x2="112" y2="370" stroke="#1a2030" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="200" y1="52" x2="288" y2="370" stroke="#1a2030" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="144" y1="280" x2="256" y2="280" stroke="#1a2030" stroke-width="2.8" stroke-linecap="round"/>

  <!-- === COMPASS HEAD === -->
  <line x1="200" y1="28" x2="186" y2="66" stroke="#1a2030" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="200" y1="28" x2="214" y2="66" stroke="#1a2030" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="200" cy="28" r="4" fill="none" stroke="#1a2030" stroke-width="1.8"/>
  <circle cx="200" cy="28" r="1.5" fill="#1a2030"/>

  <!-- === FOUR-POINTED STAR === -->
  <path d="M 200 194 L 205 220 L 200 246 L 195 220 Z" fill="#1a2030" opacity="0.85"/>
  <path d="M 174 220 L 200 215 L 226 220 L 200 225 Z" fill="#1a2030" opacity="0.85"/>
  <circle cx="200" cy="220" r="3" fill="#1a2030"/>
</svg>
