<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's New + Triage — Atlantist Admin</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png">
<meta name="theme-color" content="#0c1420">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0d0d0f; color: #e2e8f0; min-height: 100vh; }
  .header { background: #1a1a2e; border-bottom: 1px solid #2d2d4a; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 16px; font-weight: 600; }
  .header a { color: #5b9bd5; text-decoration: none; font-size: 13px; }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px; }

  .section { background: #1a1a2e; border: 1px solid #2d2d4a; border-radius: 8px; padding: 20px; margin-bottom: 24px; }
  .section-title { font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 16px; text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; justify-content: space-between; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: #64748b; margin-bottom: 4px; }
  input, select, textarea { width: 100%; padding: 8px 10px; background: #12122a; border: 1px solid #2d2d4a; border-radius: 5px; color: #e2e8f0; font-size: 13px; }
  textarea { resize: vertical; min-height: 80px; }
  button { padding: 8px 16px; border-radius: 5px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; }
  .btn-primary { background: #5b9bd5; color: white; }
  .btn-primary:hover { opacity: .85; }
  .btn-danger { background: #ef4444; color: white; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 8px 10px; font-size: 11px; color: #64748b; text-transform: uppercase; border-bottom: 1px solid #2d2d4a; }
  td { padding: 10px; border-bottom: 1px solid #1a1a2e; font-size: 13px; }
  tr:hover td { background: rgba(255,255,255,.03); }

  .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; }
  .badge-feature { background: rgba(91,155,213,.2); color: #5b9bd5; }
  .badge-bugfix { background: rgba(239,68,68,.2); color: #f87171; }
  .badge-improvement { background: rgba(249,115,22,.2); color: #fb923c; }
  .badge-breaking { background: rgba(239,68,68,.4); color: #f87171; border: 1px solid rgba(239,68,68,.5); }
  .badge-new { background: #5b9bd5; color: white; }

  .rule-enabled { width: 40px; height: 20px; border-radius: 10px; border: none; cursor: pointer; background: #2d2d4a; position: relative; }
  .rule-enabled.on { background: #5b9bd5; }
  .rule-enabled::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: white; transition: left .2s; }
  .rule-enabled.on::after { left: 20px; }

  .tabs { display: flex; gap: 0; border-bottom: 1px solid #2d2d4a; margin-bottom: 20px; }
  .tab { padding: 10px 20px; font-size: 13px; cursor: pointer; color: #64748b; border-bottom: 2px solid transparent; }
  .tab.active { color: #5b9bd5; border-bottom-color: #5b9bd5; font-weight: 600; }
  .tab:hover { color: #94a3b8; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .meta { font-size: 11px; color: #64748b; }
</style>
</head>
<body>
<div class="header">
  <h1>What's New + Smart Triage</h1>
  <a href="/admin/guides">← Guide Admin</a>
</div>
<div class="container">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('updates', this)">📣 Updates / What's New</div>
    <div class="tab" onclick="switchTab('triage', this)">🏷 Support Triage Rules</div>
  </div>

  <!-- Updates Tab -->
  <div id="tab-updates" class="tab-content active">
    <div class="section">
      <div class="section-title">Post a new update <button class="btn-primary" onclick="showNewUpdateForm()">+ New Update</button></div>
      <div id="update-form" style="display:none; background:#12122a; border:1px solid #2d2d4a; border-radius:6px; padding:16px; margin-bottom:16px">
        <div class="form-row">
          <div><label>Title *</label><input type="text" id="upd-title" placeholder="What changed?"></div>
          <div><label>Badge (e.g. New, Fixed, Improved)</label><input type="text" id="upd-badge" placeholder="New"></div>
        </div>
        <div class="form-row">
          <div><label>Category</label>
            <select id="upd-category">
              <option value="feature">Feature</option>
              <option value="bugfix">Bug Fix</option>
              <option value="improvement">Improvement</option>
              <option value="breaking">Breaking</option>
            </select>
          </div>
          <div><label>Version (optional)</label><input type="text" id="upd-version" placeholder="e.g. 2.1"></div>
        </div>
        <div><label>Body *</label><textarea id="upd-body" placeholder="Describe what changed and why it matters to users…"></textarea></div>
        <div class="form-row">
          <div><label>Action URL (optional — links to a guide or feature)</label><input type="text" id="upd-action-url" placeholder="/api/guides/all"></div>
          <div><label>Action Label (optional)</label><input type="text" id="upd-action-label" placeholder="Open Learning Hub"></div>
        </div>
        <button class="btn-primary" onclick="createUpdate()">Post Update</button>
        <button onclick="hideUpdateForm()" style="background:none;color:#64748b;margin-left:8px">Cancel</button>
      </div>

      <div id="updates-list"></div>
    </div>
  </div>

  <!-- Triage Tab -->
  <div id="tab-triage" class="tab-content">
    <div class="section">
      <div class="section-title">Support Ticket Auto-Triage Rules <button class="btn-primary" onclick="showNewRuleForm()">+ Add Rule</button></div>
      <div id="rule-form" style="display:none; background:#12122a; border:1px solid #2d2d4a; border-radius:6px; padding:16px; margin-bottom:16px">
        <div class="form-row3">
          <div><label>Keywords (comma-separated) *</label><input type="text" id="rule-keywords" placeholder="crash, error, bug, not working"></div>
          <div><label>Category</label>
            <select id="rule-category">
              <option value="billing">Billing</option>
              <option value="technical">Technical</option>
              <option value="feature_request">Feature Request</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div><label>Priority</label>
            <select id="rule-priority">
              <option value="low">Low</option>
              <option value="normal">Normal</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        <label>Confidence (1-100, higher = more confident match)</label>
        <input type="number" id="rule-confidence" value="80" min="1" max="100" style="width:120px">
        <div style="margin-top:10px">
          <button class="btn-primary" onclick="createRule()">Add Rule</button>
          <button onclick="hideRuleForm()" style="background:none;color:#64748b;margin-left:8px">Cancel</button>
        </div>
      </div>

      <div id="rules-list"></div>
    </div>
  </div>
</div>

<script src="/js/boot-safety.js"></script>
<script>
const API = '/api';
let _token = document.cookie.split(';').find(c => c.trim().startsWith('session_token='))?.trim().split('=')[1] || '';

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  return res.json();
}

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

// ─── Updates ────────────────────────────────────────────────────────
function showNewUpdateForm() {
  document.getElementById('update-form').style.display = 'block';
  document.getElementById('upd-title').focus();
}
function hideUpdateForm() { document.getElementById('update-form').style.display = 'none'; }

async function createUpdate() {
  const title = document.getElementById('upd-title').value.trim();
  const body = document.getElementById('upd-body').value.trim();
  if (!title || !body) { alert('Title and body required'); return; }
  const data = {
    title, body,
    category: document.getElementById('upd-category').value,
    badge: document.getElementById('upd-badge').value.trim() || null,
    version: document.getElementById('upd-version').value.trim() || null,
    action_url: document.getElementById('upd-action-url').value.trim() || null,
    action_label: document.getElementById('upd-action-label').value.trim() || null,
  };
  const res = await api('POST', '/api/updates/admin', data);
  if (res.error) { alert(res.error); return; }
  hideUpdateForm();
  loadUpdates();
}

async function loadUpdates() {
  const data = await api('GET', '/api/updates/admin/list?limit=50');
  const list = document.getElementById('updates-list');
  if (!data.updates || !data.updates.length) {
    list.innerHTML = '<div style="color:#64748b;font-size:13px;padding:16px;text-align:center">No updates yet.</div>';
    return;
  }
  list.innerHTML = `<table>
    <tr>
      <th>Title</th><th>Category</th><th>Badge</th><th>Action</th><th>Created</th>
    </tr>
    ${data.updates.map(u => `
      <tr>
        <td><div style="font-weight:500">${u.title}</div><div class="meta" style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.body}</div></td>
        <td><span class="badge badge-${u.category}">${u.category}</span></td>
        <td>${u.badge ? `<span class="badge badge-new">${u.badge}</span>` : '—'}</td>
        <td>${u.action_url ? `<a href="${u.action_url}" style="color:#5b9bd5;font-size:12px">${u.action_label || u.action_url}</a>` : '—'}</td>
        <td class="meta">${new Date(u.created_at).toLocaleDateString()}</td>
      </tr>
    `).join('')}
  </table>`;
}

// ─── Triage Rules ───────────────────────────────────────────────────
function showNewRuleForm() {
  document.getElementById('rule-form').style.display = 'block';
  document.getElementById('rule-keywords').focus();
}
function hideRuleForm() { document.getElementById('rule-form').style.display = 'none'; }

async function createRule() {
  const keywordsRaw = document.getElementById('rule-keywords').value.trim();
  if (!keywordsRaw) { alert('Keywords required'); return; }
  const keywords = keywordsRaw.split(',').map(k => k.trim()).filter(Boolean);
  const data = {
    keywords,
    category: document.getElementById('rule-category').value,
    priority: document.getElementById('rule-priority').value,
    confidence: parseInt(document.getElementById('rule-confidence').value, 10) || 80,
  };
  const res = await api('POST', '/api/support/triage/rules', data);
  if (res.error) { alert(res.error); return; }
  hideRuleForm();
  loadRules();
}

async function toggleRule(id, currentEnabled) {
  await api('PATCH', `/api/support/triage/rules/${id}`, { enabled: !currentEnabled });
  loadRules();
}

async function deleteRule(id) {
  if (!confirm('Delete this rule?')) return;
  await api('DELETE', `/api/support/triage/rules/${id}`);
  loadRules();
}

async function loadRules() {
  const data = await api('GET', '/api/support/triage/rules');
  const list = document.getElementById('rules-list');
  if (!data.rules || !data.rules.length) {
    list.innerHTML = '<div style="color:#64748b;font-size:13px;padding:16px;text-align:center">No rules yet.</div>';
    return;
  }
  list.innerHTML = `<table>
    <tr><th>Keywords</th><th>Category</th><th>Priority</th><th>Confidence</th><th>Enabled</th><th></th></tr>
    ${data.rules.map(r => `
      <tr>
        <td><div style="display:flex;flex-wrap:wrap;gap:4px">${r.keywords.map(k => `<span style="background:#2d2d4a;padding:2px 6px;border-radius:3px;font-size:11px">${k}</span>`).join('')}</div></td>
        <td>${r.category}</td>
        <td><span style="color:${r.priority === 'high' ? '#ef4444' : r.priority === 'low' ? '#94a3b8' : '#fb923c'}">${r.priority}</span></td>
        <td>${r.confidence}%</td>
        <td><button class="rule-enabled ${r.enabled ? 'on' : ''}" onclick="toggleRule(${r.id}, ${r.enabled})"></button></td>
        <td><button class="btn-danger" onclick="deleteRule(${r.id})" style="padding:4px 10px;font-size:11px">Delete</button></td>
      </tr>
    `).join('')}
  </table>`;
}

loadUpdates();
loadRules();
</script>
</body>
</html>
