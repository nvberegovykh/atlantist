name: Publish Open Source

# Runs after every push to main — sanitizes the codebase and pushes a
# clean snapshot to the public GitHub repo (atlantist-bim/atlantist).
#
# Gates (must all pass first):
#   1. secret-scan   — zero secrets in committed code
#   2. lint          — architecture rules + ESLint
#   3. smoke-test    — /health, static assets, JS serving
#
# On each main push:
#   → Run sanitize.js --public → .open-source-build/
#   → Push snapshot to atlantist-bim/atlantist (force-push to 'main')
#
# Required secret: PUBLISH_REPO_TOKEN
#   Fine-grained PAT scoped to: repo, contents:write on atlantist-bim/atlantist
#   Set in: GitHub repo Settings → Secrets → Actions → PUBLISH_REPO_TOKEN
#
# No bypass path exists. Admins must clean the branch if any gate fails.

on:
  workflow_run:
    workflow: CI
    types: [completed]
    branches: [main, master]

jobs:
  publish:
    name: Publish Sanitized Snapshot
    runs-on: ubuntu-latest
    # Only run if the CI workflow succeeded (all gates passed)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout (main repo, shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # ── Step 1: Run full secret scan first ──────────────────────────────
      - name: Re-run secret scan (gate)
        run: node scripts/secret-scan.js
        # This should be clean since CI already passed it, but double-check
        # before touching the public repo.

      # ── Step 2: Generate sanitized public snapshot ──────────────────────
      - name: Sanitize codebase
        run: node scripts/sanitize.js .open-source-build --public
        # --public: skip the fail-gate (secrets already verified clean above)
        #            still applies all redaction patterns

      # ── Step 3: Verify snapshot is clean ────────────────────────────────
      - name: Verify sanitized snapshot has no secrets
        run: node scripts/secret-scan.js --json-output | tee /tmp/scan-result.json
        # Run scan against the output dir to confirm nothing leaked through
        # the sanitization step.
        working-directory: .open-source-build

      # ── Step 4: Push to public repo ──────────────────────────────────────
      - name: Configure git identity
        run: |
          git config --global user.name "Atlantist CI"
          git config --global user.email "ci@atlantist.io"

      - name: Push sanitized snapshot to public repo
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_REPO_TOKEN }}
        run: |
          set -e

          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "ERROR: PUBLISH_REPO_TOKEN is not set in GitHub Actions secrets."
            echo "To enable open-source publishing:"
            echo "  1. Generate a fine-grained PAT at https://github.com/settings/tokens"
            echo "     - Scope: 'repo' (full), contents:write on atlantist-bim/atlantist"
            echo "  2. Add it as a secret: Settings → Secrets → Actions → PUBLISH_REPO_TOKEN"
            exit 1
          fi

          # Clone the public repo (empty initial state — create first commit manually)
          git clone "https://x-access-token:${PUBLISH_TOKEN}@github.com/atlantist-bim/atlantist.git" /tmp/public-repo
          cd /tmp/public-repo

          # Remove everything except .git (fresh slate per push)
          git rm -rf --cached .
          git clean -fd

          # Copy sanitized snapshot
          cp -r "$GITHUB_WORKSPACE/.open-source-build/"* .
          # Remove the generated .gitignore (will be committed fresh)
          rm -f .open-source-build/.gitignore

          # Add all files and commit
          git add .
          git commit -m "Open-source snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ') — generated by Atlantist CI

          Commit contains the full sanitized source tree with:
          - All secrets, API keys, and connection strings redacted
          - Polsia-internal references removed
          - Apache License 2.0 headers prepended to all .js files
          - Public .gitignore generated

          Source: Polsia-Inc/nexaxis @ $(git rev-parse --short HEAD)

          Generated by publish-open-source.yml on main push.
          See atlantist-bim/atlantist for the canonical open-source repo."

          # Force-push to main (replaces entire history — single source of truth)
          git push --force "https://x-access-token:${PUBLISH_TOKEN}@github.com/atlantist-bim/atlantist.git" main
          echo "Published to https://github.com/atlantist-bim/atlantist"