name: Sentry Release

# Creates a Sentry release and associates commits on every push to main.
# Requires SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT secrets in GitHub.
# No-op if secrets are not set — safe to merge before Sentry is configured.

on:
  push:
    branches: [main]

jobs:
  sentry-release:
    name: Create Sentry Release
    runs-on: ubuntu-latest
    # Skip entirely if Sentry isn't configured yet
    if: ${{ vars.SENTRY_ORG != '' || secrets.SENTRY_AUTH_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for commit association

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:        ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT:    ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version:     ${{ github.sha }}
