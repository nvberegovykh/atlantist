name: Notion Dev Log

# Posts a structured dev log entry to the LIBER Projects & Tasks Notion page
# on every push to main. Requires NOTION_TOKEN secret in GitHub.
# No-op if NOTION_TOKEN is not set.

on:
  push:
    branches: [main]

jobs:
  devlog:
    name: Post to Notion Dev Log
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Post commit to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          COMMIT_SHA:   ${{ github.sha }}
          COMMIT_MSG:   ${{ github.event.head_commit.message }}
          COMMIT_URL:   ${{ github.event.head_commit.url }}
          AUTHOR:       ${{ github.event.head_commit.author.name }}
          TIMESTAMP:    ${{ github.event.head_commit.timestamp }}
          # LIBER Projects & Tasks (master) page ID
          NOTION_PAGE_ID: 24b49cd22e468001b464fbd596191adf
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "NOTION_TOKEN not set — skipping Notion dev log"
            exit 0
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"
          # Truncate message to first line only, max 200 chars
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1 | cut -c1-200)

          PAYLOAD=$(cat <<JSON
          {
            "parent": { "page_id": "${NOTION_PAGE_ID}" },
            "properties": {
              "title": {
                "title": [{ "text": { "content": "[${SHORT_SHA}] ${FIRST_LINE}" } }]
              }
            },
            "children": [
              {
                "object": "block",
                "type": "callout",
                "callout": {
                  "icon": { "type": "emoji", "emoji": "🔨" },
                  "rich_text": [
                    { "type": "text", "text": { "content": "Commit: " } },
                    { "type": "text", "text": { "content": "${SHORT_SHA}", "link": { "url": "${COMMIT_URL}" } }, "annotations": { "code": true } },
                    { "type": "text", "text": { "content": " by ${AUTHOR} at ${TIMESTAMP}" } }
                  ]
                }
              },
              {
                "object": "block",
                "type": "paragraph",
                "paragraph": {
                  "rich_text": [{ "type": "text", "text": { "content": "${COMMIT_MSG}" } }]
                }
              }
            ]
          }
          JSON
          )

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://api.notion.com/v1/pages \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Dev log posted to Notion (${SHORT_SHA})"
          else
            echo "Notion post failed: $HTTP_CODE — $BODY"
            exit 0  # Non-fatal — don't block CI
          fi
