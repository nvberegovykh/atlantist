<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" width="960" height="1200" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7f6f3"/>
      <stop offset="100%" stop-color="#e8e6e1"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134a84"/>
      <stop offset="100%" stop-color="#3479c4"/>
    </linearGradient>
    <linearGradient id="dot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3479c4"/>
      <stop offset="100%" stop-color="#7fb3de"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="1200" fill="url(#bg-grad)"/>

  <!-- Top rule -->
  <rect x="0" y="0" width="960" height="4" fill="#1d5fa6"/>

  <!-- ── Header ─────────────────────────────────────────── -->
  <text x="48" y="64" font-family="Georgia, serif" font-size="11" fill="#8a8680" letter-spacing="3">ATLANTIST  ·  BRAND IDENTITY SYSTEM  ·  2026</text>
  <line x1="48" y1="72" x2="912" y2="72" stroke="#e8e6e1" stroke-width="1"/>

  <!-- ── Section 1: Logo ────────────────────────────────── -->
  <text x="48" y="112" font-family="Georgia, serif" font-size="10" fill="#8a8680" letter-spacing="2">01  LOGO</text>

  <!-- Logo on light -->
  <rect x="48" y="124" width="380" height="100" rx="6" fill="white" stroke="#e8e6e1" stroke-width="1"/>
  <!-- Monogram -->
  <circle cx="104" cy="174" r="22" fill="none" stroke="#1d5fa6" stroke-width="1.5" opacity="0.18"/>
  <circle cx="104" cy="174" r="16" fill="none" stroke="#1d5fa6" stroke-width="1.5" opacity="0.35"/>
  <circle cx="104" cy="174" r="10" fill="none" stroke="#1d5fa6" stroke-width="1.5" opacity="0.6"/>
  <circle cx="104" cy="174" r="4.5" fill="url(#accent-grad)"/>
  <line x1="93" y1="186" x2="104" y2="158" stroke="#1d5fa6" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="115" y1="186" x2="104" y2="158" stroke="#1d5fa6" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="96.5" y1="177" x2="111.5" y2="177" stroke="#1d5fa6" stroke-width="2.2" stroke-linecap="round"/>
  <text x="136" y="181" font-family="Georgia, serif" font-size="26" fill="#0f1923" letter-spacing="-0.5">Atlantist</text>
  <line x1="136" y1="186" x2="322" y2="186" stroke="#1d5fa6" stroke-width="1" opacity="0.25"/>
  <text x="238" y="213" font-family="Georgia, serif" font-size="9" fill="#8a8680" text-anchor="middle">Primary — Light</text>

  <!-- Logo on dark -->
  <rect x="444" y="124" width="380" height="100" rx="6" fill="#0f1923"/>
  <circle cx="500" cy="174" r="22" fill="none" stroke="#7fb3de" stroke-width="1.5" opacity="0.2"/>
  <circle cx="500" cy="174" r="16" fill="none" stroke="#7fb3de" stroke-width="1.5" opacity="0.4"/>
  <circle cx="500" cy="174" r="10" fill="none" stroke="#7fb3de" stroke-width="1.5" opacity="0.65"/>
  <circle cx="500" cy="174" r="4.5" fill="url(#dot-grad)"/>
  <line x1="489" y1="186" x2="500" y2="158" stroke="#cfe3f5" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="511" y1="186" x2="500" y2="158" stroke="#cfe3f5" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="492.5" y1="177" x2="507.5" y2="177" stroke="#cfe3f5" stroke-width="2.2" stroke-linecap="round"/>
  <text x="532" y="181" font-family="Georgia, serif" font-size="26" fill="#f7f6f3" letter-spacing="-0.5">Atlantist</text>
  <line x1="532" y1="186" x2="718" y2="186" stroke="#7fb3de" stroke-width="1" opacity="0.3"/>
  <text x="634" y="213" font-family="Georgia, serif" font-size="9" fill="#8a8680" text-anchor="middle">Primary — Dark</text>

  <!-- ── Section 2: Monogram ────────────────────────────── -->
  <text x="48" y="268" font-family="Georgia, serif" font-size="10" fill="#8a8680" letter-spacing="2">02  MONOGRAM  ·  APP ICON</text>

  <!-- Icon sizes -->
  <!-- 512px representation -->
  <rect x="48" y="280" width="96" height="96" rx="18" fill="#0f1923"/>
  <circle cx="96" cy="331" r="38" fill="none" stroke="#7fb3de" stroke-width="1.8" opacity="0.2"/>
  <circle cx="96" cy="331" r="27" fill="none" stroke="#7fb3de" stroke-width="1.8" opacity="0.38"/>
  <circle cx="96" cy="331" r="16" fill="none" stroke="#7fb3de" stroke-width="1.8" opacity="0.6"/>
  <circle cx="96" cy="331" r="6" fill="url(#dot-grad)"/>
  <line x1="74" y1="352" x2="96" y2="302" stroke="#f7f6f3" stroke-width="4" stroke-linecap="round"/>
  <line x1="118" y1="352" x2="96" y2="302" stroke="#f7f6f3" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="340" x2="112" y2="340" stroke="#f7f6f3" stroke-width="4" stroke-linecap="round"/>
  <text x="96" y="392" font-family="Georgia, serif" font-size="9" fill="#8a8680" text-anchor="middle">512px</text>

  <!-- 192px representation -->
  <rect x="164" y="296" width="64" height="64" rx="12" fill="#0f1923"/>
  <circle cx="196" cy="328" r="25" fill="none" stroke="#7fb3de" stroke-width="1.2" opacity="0.2"/>
  <circle cx="196" cy="328" r="18" fill="none" stroke="#7fb3de" stroke-width="1.2" opacity="0.38"/>
  <circle cx="196" cy="328" r="11" fill="none" stroke="#7fb3de" stroke-width="1.2" opacity="0.6"/>
  <circle cx="196" cy="328" r="3.5" fill="url(#dot-grad)"/>
  <line x1="183" y1="345" x2="196" y2="311" stroke="#f7f6f3" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="209" y1="345" x2="196" y2="311" stroke="#f7f6f3" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="187" y1="335" x2="205" y2="335" stroke="#f7f6f3" stroke-width="2.8" stroke-linecap="round"/>
  <text x="196" y="376" font-family="Georgia, serif" font-size="9" fill="#8a8680" text-anchor="middle">192px</text>

  <!-- 64px representation -->
  <rect x="248" y="308" width="48" height="48" rx="8" fill="#0f1923"/>
  <circle cx="272" cy="332" r="18" fill="none" stroke="#7fb3de" stroke-width="1" opacity="0.2"/>
  <circle cx="272" cy="332" r="13" fill="none" stroke="#7fb3de" stroke-width="1" opacity="0.38"/>
  <circle cx="272" cy="332" r="8" fill="none" stroke="#7fb3de" stroke-width="1" opacity="0.6"/>
  <circle cx="272" cy="332" r="3" fill="url(#dot-grad)"/>
  <line x1="260" y1="347" x2="272" y2="318" stroke="#f7f6f3" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="284" y1="347" x2="272" y2="318" stroke="#f7f6f3" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="264" y1="339" x2="280" y2="339" stroke="#f7f6f3" stroke-width="2.2" stroke-linecap="round"/>
  <text x="272" y="368" font-family="Georgia, serif" font-size="9" fill="#8a8680" text-anchor="middle">64px</text>

  <!-- 32px representation -->
  <rect x="316" y="316" width="32" height="32" rx="5" fill="#0f1923"/>
  <line x1="322" y1="341" x2="332" y2="318" stroke="#f7f6f3" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="342" y1="341" x2="332" y2="318" stroke="#f7f6f3" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="324" y1="334" x2="340" y2="334" stroke="#f7f6f3" stroke-width="1.8" stroke-linecap="round"/>
  <text x="332" y="360" font-family="Georgia, serif" font-size="9" fill="#8a8680" text-anchor="middle">32px</text>

  <!-- Clear space rule -->
  <text x="444" y="292" font-family="Georgia, serif" font-size="10" fill="#3d3a35">Clear space</text>
  <text x="444" y="308" font-family="Georgia, serif" font-size="9" fill="#8a8680">Minimum clear space = ½ × ring radius on all sides.</text>
  <text x="444" y="322" font-family="Georgia, serif" font-size="9" fill="#8a8680">Never crop the outer ring. Never place on busy patterns.</text>

  <text x="444" y="350" font-family="Georgia, serif" font-size="10" fill="#3d3a35">Do</text>
  <text x="444" y="366" font-family="Georgia, serif" font-size="9" fill="#8a8680">• Use on solid dark or light backgrounds</text>
  <text x="444" y="380" font-family="Georgia, serif" font-size="9" fill="#8a8680">• Scale uniformly, never stretch</text>
  <text x="444" y="394" font-family="Georgia, serif" font-size="9" fill="#8a8680">• Use SVG or vector source at all sizes</text>

  <text x="680" y="350" font-family="Georgia, serif" font-size="10" fill="#dc2626">Don't</text>
  <text x="680" y="366" font-family="Georgia, serif" font-size="9" fill="#8a8680">• Recolor the rings or wordmark individually</text>
  <text x="680" y="380" font-family="Georgia, serif" font-size="9" fill="#8a8680">• Remove the concentric rings</text>
  <text x="680" y="394" font-family="Georgia, serif" font-size="9" fill="#8a8680">• Use PNG below 192×192px</text>

  <!-- ── Section 3: Color ───────────────────────────────── -->
  <text x="48" y="430" font-family="Georgia, serif" font-size="10" fill="#8a8680" letter-spacing="2">03  COLOR TOKENS</text>

  <!-- Swatches row 1 -->
  <!-- ink -->
  <rect x="48" y="444" width="100" height="60" rx="4" fill="#0f1923"/>
  <text x="98" y="518" font-family="Georgia, serif" font-size="9" fill="#3d3a35" text-anchor="middle">--brand-ink</text>
  <text x="98" y="530" font-family="Georgia, serif" font-size="8" fill="#8a8680" text-anchor="middle">#0f1923</text>

  <!-- paper -->
  <rect x="162" y="444" width="100" height="60" rx="4" fill="#f7f6f3" stroke="#e8e6e1" stroke-width="1"/>
  <text x="212" y="518" font-family="Georgia, serif" font-size="9" fill="#3d3a35" text-anchor="middle">--brand-paper</text>
  <text x="212" y="530" font-family="Georgia, serif" font-size="8" fill="#8a8680" text-anchor="middle">#f7f6f3</text>

  <!-- accent -->
  <rect x="276" y="444" width="100" height="60" rx="4" fill="#1d5fa6"/>
  <text x="326" y="518" font-family="Georgia, serif" font-size="9" fill="#3d3a35" text-anchor="middle">--brand-accent</text>
  <text x="326" y="530" font-family="Georgia, serif" font-size="8" fill="#8a8680" text-anchor="middle">#1d5fa6</text>

  <!-- accent-light -->
  <rect x="390" y="444" width="100" height="60" rx="4" fill="#3479c4"/>
  <text x="440" y="518" font-family="Georgia, serif" font-size="9" fill="#3d3a35" text-anchor="middle">accent-light</text>
  <text x="440" y="530" font-family="Georgia, serif" font-size="8" fill="#8a8680" text-anchor="middle">#3479c4</text>

  <!-- warn -->
  <rect x="504" y="444" width="100" height="60" rx="4" fill="#d97706"/>
  <text x="554" y="518" font-family="Georgia, serif" font-size="9" fill="#3d3a35" text-anchor="middle">--brand-warn</text>
  <text x="554" y="530" font-family="Georgia, serif" font-size="8" fill="#8a8680" text-anchor="middle">#d97706</text>

  <!-- success -->
  <rect x="618" y="444" width="100" height="60" rx="4" fill="#16a34a"/>
  <text x="668" y="518" font-family="Georgia, serif" font-size="9" fill="#3d3a35" text-anchor="middle">--brand-success</text>
  <text x="668" y="530" font-family="Georgia, serif" font-size="8" fill="#8a8680" text-anchor="middle">#16a34a</text>

  <!-- error -->
  <rect x="732" y="444" width="100" height="60" rx="4" fill="#dc2626"/>
  <text x="782" y="518" font-family="Georgia, serif" font-size="9" fill="#3d3a35" text-anchor="middle">--brand-error</text>
  <text x="782" y="530" font-family="Georgia, serif" font-size="8" fill="#8a8680" text-anchor="middle">#dc2626</text>

  <!-- Neutrals ramp -->
  <rect x="48" y="545" width="274" height="40" rx="4" fill="#e8e6e1"/>
  <text x="185" y="572" font-family="Georgia, serif" font-size="9" fill="#3d3a35" text-anchor="middle">--brand-n100  #e8e6e1</text>

  <rect x="336" y="545" width="274" height="40" rx="4" fill="#8a8680"/>
  <text x="473" y="572" font-family="Georgia, serif" font-size="9" fill="#f7f6f3" text-anchor="middle">--brand-n400  #8a8680</text>

  <rect x="624" y="545" width="274" height="40" rx="4" fill="#3d3a35"/>
  <text x="761" y="572" font-family="Georgia, serif" font-size="9" fill="#f7f6f3" text-anchor="middle">--brand-n700  #3d3a35</text>

  <!-- Ring tones -->
  <rect x="48" y="598" width="280" height="32" rx="4" fill="#cfe3f5"/>
  <text x="188" y="619" font-family="Georgia, serif" font-size="9" fill="#0f1923" text-anchor="middle">ring-1  #cfe3f5</text>
  <rect x="340" y="598" width="280" height="32" rx="4" fill="#7fb3de"/>
  <text x="480" y="619" font-family="Georgia, serif" font-size="9" fill="#0f1923" text-anchor="middle">ring-2  #7fb3de</text>
  <rect x="632" y="598" width="280" height="32" rx="4" fill="#1d5fa6"/>
  <text x="772" y="619" font-family="Georgia, serif" font-size="9" fill="#f7f6f3" text-anchor="middle">ring-3  #1d5fa6</text>

  <!-- ── Section 4: Typography ───────────────────────────── -->
  <text x="48" y="672" font-family="Georgia, serif" font-size="10" fill="#8a8680" letter-spacing="2">04  TYPE SCALE</text>
  <line x1="48" y1="680" x2="912" y2="680" stroke="#e8e6e1" stroke-width="1"/>

  <text x="48" y="710" font-family="Georgia, serif" font-size="42" fill="#0f1923" letter-spacing="-1">Display — 42px / 1.08lh / 400</text>
  <text x="48" y="746" font-family="Georgia, serif" font-size="32" fill="#0f1923">H1 — 32px / 1.12lh / 600</text>
  <text x="48" y="776" font-family="Georgia, serif" font-size="24" fill="#0f1923">H2 — 24px / 1.2lh / 600</text>
  <text x="48" y="802" font-family="Georgia, serif" font-size="18" fill="#0f1923">H3 — 18px / 1.3lh / 600</text>
  <text x="48" y="824" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#0f1923">H4 — 14px / 1.4lh / 700</text>
  <text x="48" y="844" font-family="Georgia, serif" font-size="14" fill="#3d3a35">Body — 14px / 1.6lh / 400  ·  The quick brown fox jumps over the lazy dog.</text>
  <text x="48" y="862" font-family="Georgia, serif" font-size="11" fill="#8a8680">Caption — 11px / 1.5lh / 400  ·  Timestamps, annotations, metadata labels</text>
  <text x="48" y="880" font-family="'Courier New', monospace" font-size="12" fill="#3d3a35">Mono — 12px / 1.6lh / 400  ·  element_id: wall_019  z: 24.500m</text>

  <!-- Font families label -->
  <text x="560" y="710" font-family="Georgia, serif" font-size="10" fill="#8a8680">Display + Headings</text>
  <text x="560" y="726" font-family="Georgia, serif" font-size="13" fill="#1d5fa6">DM Serif Display</text>
  <text x="560" y="750" font-family="Georgia, serif" font-size="10" fill="#8a8680">UI + Body</text>
  <text x="560" y="766" font-family="Georgia, serif" font-size="13" fill="#1d5fa6">DM Sans</text>
  <text x="560" y="790" font-family="Georgia, serif" font-size="10" fill="#8a8680">Code + Coordinates</text>
  <text x="560" y="806" font-family="'Courier New', monospace" font-size="13" fill="#1d5fa6">DM Mono</text>

  <!-- ── Section 5: Usage rules ─────────────────────────── -->
  <text x="48" y="930" font-family="Georgia, serif" font-size="10" fill="#8a8680" letter-spacing="2">05  USAGE RULES</text>
  <line x1="48" y1="938" x2="912" y2="938" stroke="#e8e6e1" stroke-width="1"/>

  <text x="48" y="962" font-family="Georgia, serif" font-size="11" fill="#0f1923">Logo placement</text>
  <text x="48" y="978" font-family="Georgia, serif" font-size="9" fill="#8a8680">Always use vector SVG source. Minimum display width: 120px. Never rasterize below 2× target size.</text>

  <text x="48" y="1002" font-family="Georgia, serif" font-size="11" fill="#0f1923">Color on color</text>
  <text x="48" y="1018" font-family="Georgia, serif" font-size="9" fill="#8a8680">Ensure minimum 4.5:1 contrast ratio for body text. --brand-accent on --brand-paper passes WCAG AA.</text>
  <text x="48" y="1032" font-family="Georgia, serif" font-size="9" fill="#8a8680">Never place --brand-accent text on --brand-ring2 background (fails contrast).</text>

  <text x="48" y="1056" font-family="Georgia, serif" font-size="11" fill="#0f1923">Email footer</text>
  <text x="48" y="1072" font-family="Georgia, serif" font-size="9" fill="#8a8680">Use dark-variant logo inline SVG. Background: --brand-ink (#0f1923). Font: DM Sans, 13px.</text>

  <text x="480" y="962" font-family="Georgia, serif" font-size="11" fill="#0f1923">Characters</text>
  <text x="480" y="978" font-family="Georgia, serif" font-size="9" fill="#8a8680">3 illustrations: Drafter (landing hero), Inspectors (collaboration), Explorer (3D empty state).</text>
  <text x="480" y="992" font-family="Georgia, serif" font-size="9" fill="#8a8680">All share navy + cobalt palette. Do not apply color filters or mix with other illustration styles.</text>

  <text x="480" y="1016" font-family="Georgia, serif" font-size="11" fill="#0f1923">OG Image</text>
  <text x="480" y="1032" font-family="Georgia, serif" font-size="9" fill="#8a8680">1200×630px. --brand-ink background, centered logo (dark variant), tagline below.</text>
  <text x="480" y="1046" font-family="Georgia, serif" font-size="9" fill="#8a8680">Tagline: "BIM 2.0 — Build smarter, coordinate faster."</text>

  <!-- Footer -->
  <line x1="48" y1="1150" x2="912" y2="1150" stroke="#e8e6e1" stroke-width="1"/>
  <text x="48" y="1170" font-family="Georgia, serif" font-size="9" fill="#8a8680">Atlantist Brand Identity System  ·  Version 1.0  ·  2026-05-24</text>
  <text x="912" y="1170" font-family="Georgia, serif" font-size="9" fill="#1d5fa6" text-anchor="end">atlantist.cloud</text>

  <!-- Bottom rule -->
  <rect x="0" y="1196" width="960" height="4" fill="#1d5fa6"/>
</svg>
