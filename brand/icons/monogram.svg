<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Atlantist monogram">
  <title>Atlantist — A mark</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#1a2e45"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3479c4"/>
      <stop offset="100%" stop-color="#7fb3de"/>
    </linearGradient>
  </defs>

  <!-- Square background with slight rounding (icon format) -->
  <rect width="64" height="64" rx="12" fill="url(#bgGrad)"/>

  <!-- Concentric rings centered at 32,33 -->
  <circle cx="32" cy="33" r="25" fill="none" stroke="#7fb3de" stroke-width="1.2" opacity="0.2"/>
  <circle cx="32" cy="33" r="18" fill="none" stroke="#7fb3de" stroke-width="1.2" opacity="0.38"/>
  <circle cx="32" cy="33" r="11" fill="none" stroke="#7fb3de" stroke-width="1.2" opacity="0.6"/>
  <!-- Center core dot -->
  <circle cx="32" cy="33" r="4" fill="url(#dotGrad)"/>

  <!-- A letterform — bold, bridging all three rings -->
  <!-- Left leg -->
  <line x1="18" y1="48" x2="32" y2="14" stroke="#f7f6f3" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="46" y1="48" x2="32" y2="14" stroke="#f7f6f3" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Crossbar at ~middle ring radius -->
  <line x1="22" y1="36" x2="42" y2="36" stroke="#f7f6f3" stroke-width="2.8" stroke-linecap="round"/>
</svg>
