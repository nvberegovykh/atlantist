<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 56" width="280" height="56" role="img" aria-label="Atlantist">
  <title>Atlantist</title>
  <defs>
    <!-- Brand gradient: deep ocean to sky -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134a84"/>
      <stop offset="100%" stop-color="#3479c4"/>
    </linearGradient>
    <clipPath id="monoCrop">
      <circle cx="26" cy="28" r="22"/>
    </clipPath>
  </defs>

  <!-- ── Monogram mark ──────────────────────────────────── -->
  <!-- Concentric rings (Atlantis city plan geometry) -->
  <circle cx="26" cy="28" r="22" fill="none" stroke="#1d5fa6" stroke-width="1.5" opacity="0.18"/>
  <circle cx="26" cy="28" r="16" fill="none" stroke="#1d5fa6" stroke-width="1.5" opacity="0.35"/>
  <circle cx="26" cy="28" r="10" fill="none" stroke="#1d5fa6" stroke-width="1.5" opacity="0.6"/>
  <circle cx="26" cy="28" r="4.5" fill="url(#accentGrad)"/>

  <!-- A letterform bridging the rings -->
  <!-- Left leg -->
  <line x1="15" y1="40" x2="26" y2="12" stroke="#1d5fa6" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="37" y1="40" x2="26" y2="12" stroke="#1d5fa6" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Crossbar (sits at ring-2 radius) -->
  <line x1="18.5" y1="31" x2="33.5" y2="31" stroke="#1d5fa6" stroke-width="2.2" stroke-linecap="round"/>

  <!-- ── Wordmark ───────────────────────────────────────── -->
  <!-- "Atlantist" in DM Serif Display-style paths -->
  <!-- Rendered as text with embedded font reference for browser rendering -->
  <text
    x="60"
    y="37"
    font-family="'DM Serif Display', Georgia, serif"
    font-size="26"
    font-weight="400"
    letter-spacing="-0.5"
    fill="#0f1923"
  >Atlantist</text>

  <!-- Micro rule: thin accent line beneath wordmark -->
  <line x1="60" y1="42" x2="248" y2="42" stroke="#1d5fa6" stroke-width="1" opacity="0.25"/>
</svg>
